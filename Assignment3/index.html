<!doctype html>
<html lang="en">
	
<head>

	<title>Rhythm and Riffs Event Page</title>
	
	<style>
	
		@font-face {
			font-family: "woodward";
			src: url("Woodward-Regular.ttf") format("truetype");
		}
		
		body {
			margin: 0;
			padding: 0;
			background-color: #555555;
			background-image: url(GrayBrickBackground.png);
			background-repeat: repeat;
			background-size: cover;
		}
		
		#page {
			width: 1024px;
			min-height: 1224px;
			margin: 0 auto;
			padding: 25px 50px 60px 50px;
			box-sizing: border-box;
			border: 2px solid #1498e8;
		}
		
		header {
			margin-botom: 30px;
		}
		
		h1 {
			margin: 0;
			font-family: "Woodward", Impact, sans-serif;
			font-weight: normal;
			font-size: 58pt;
			line-height: 1em;
			color: white;
			text-shadow: 2px 3px 4px #333333;
		}
		
		#eventDetails {
			margin: 8px 0 0 0;
			font: bold 16pt/1.2em Arial, Helvetica, sans-serif;
			color: white;
			text-shadow: 2px 2px 3px #333333;
		}
	
	/*
		This page currently functions as a portfolio of photos from one event. In the completed version of the band's website, this layout will be a daughter page of a larger "Past Events" gallery, where each event will link to its own version of this portfolio page.
	*/
		
		#portfolio {
			display: flex;
			flex-wrap: wrap;
			justify-content: space-between;
		}
		
		figure a {
			display: block;
		}
		
		figure img {
			width: 200px;
			height: 255px;
			display: block;
			object-fit: cover;
			border: 1px solid #333333;
			box-shadow: 3px 4px 6px #333333;
		}
		
		figure img:hover {
			border-color: white;
			box-shadow: 4px 5px 10px #111111;
		}
		
		figcaption {
			margin-top: 8px;
			font: 11pt/1.3em Georgia, "Times New Roman", serif;
			text-align: center;
			color: white;
			text-shadow: 1px 1px 2px #333333;
		}
		
	</style>
	
</head>
